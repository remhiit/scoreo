name: Queue PR for Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale verdict labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/review-pass" || true
          gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/needs-fix" || true

      - name: Add automation:needs-review label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=needs-review"
