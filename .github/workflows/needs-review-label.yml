name: Queue PR for Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, unlabeled]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    # A PR the coordinator owns is never queued for a standalone R3: its run
    # already reviewed it, and `review-status-carry.yml` keeps `claude/review`
    # on a pure rebase. Removing `automation:coordinator-owned` by hand is the
    # handoff back to R3 — hence `unlabeled`, filtered to that one label.
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'automation:coordinator-owned') &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'automation:coordinator-owned')
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale verdict labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/automation:review-pass" || true
          gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/automation:needs-fix" || true

      - name: Add automation:needs-review label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=automation:needs-review"
