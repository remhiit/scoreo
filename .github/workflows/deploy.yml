name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      npm_config_registry: https://registry.npmjs.org

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Run tests
        run: gradle jvmTest

      - name: Build production
        run: gradle jsBrowserProductionWebpack

      - name: Copy static assets
        run: cp -r src/jsMain/resources/. build/kotlin-webpack/js/productionExecutable/

      - name: Verify CSS is present
        run: test -f build/kotlin-webpack/js/productionExecutable/styles.css

      - name: Verify all resources are in artifact
        run: |
          for f in src/jsMain/resources/*; do
            name=$(basename "$f")
            test -f "build/kotlin-webpack/js/productionExecutable/$name" \
              || (echo "Missing from artifact: $name" && exit 1)
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/kotlin-webpack/js/productionExecutable/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test deployed site
        env:
          BASE: ${{ needs.deploy.outputs.page_url }}
        run: |
          for path in "" styles.css scoreo.js; do
            url="${BASE}${path}"
            echo "Checking $url..."
            for i in 1 2 3 4 5; do
              curl --fail --silent --head "$url" && break
              [ $i -eq 5 ] && echo "FAILED: $url" && exit 1
              echo "Retry $i/5 in 15s..."
              sleep 15
            done
          done
