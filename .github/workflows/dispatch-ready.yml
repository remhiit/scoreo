name: Dispatch Ready Issue to R2

on:
  issues:
    types: [labeled]

jobs:
  dispatch:
    if: github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    steps:
      - name: Fire R2 routine
        env:
          ROUTINE_ID: ${{ secrets.ROUTINE_ID }}
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$ROUTINE_ID" ] || [ -z "$ROUTINE_TOKEN" ]; then
            echo "ROUTINE_ID/ROUTINE_TOKEN not set — skipping (R2 routine not created yet)."
            exit 0
          fi
          curl -sf -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/$ROUTINE_ID/fire" \
            -H "Authorization: Bearer $ROUTINE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"Implémente l'issue #$ISSUE_NUMBER en suivant .claude/skills/implement-task\"}"
