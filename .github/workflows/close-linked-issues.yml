name: Close Linked Issues

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_OWNER: remhiit
      REPO_NAME: scoreo
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Close issues referenced by the merged PR's closing keywords
        run: node scripts/close-linked-issues.mjs
