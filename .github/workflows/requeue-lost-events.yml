name: Requeue Lost Routine Events

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  issues:
    types: [unlabeled, closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  requeue:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_OWNER: remhiit
      REPO_NAME: scoreo
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Requeue orphaned automation:ready/needs-review/needs-fix labels
        run: node scripts/requeue-lost-events.mjs

      - name: Catch up issues left open by auto-merged PRs
        run: node scripts/sweep-merged-prs.mjs

      - name: Dispatch next queued issue to ready
        run: node scripts/dispatch-ready.mjs
