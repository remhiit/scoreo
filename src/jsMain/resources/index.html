<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6750a4"/>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Scoreo">
    <title>Scoreo</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Identity Services (for OAuth login) -->
    <script src="https://accounts.google.com/gsi/client"></script>
</head>
<body>
    <!-- Splash/Loader (visible until bundle loads) -->
    <div id="splash" class="splash">
        <div class="splash-content">
            <h1>Scoreo</h1>
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </div>
    
    <div id="root"></div>
    <script src="scoreo.js"></script>
    <script>
  var isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if ('serviceWorker' in navigator) {
    if (isDev) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      });
    } else {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  }
</script>
</body>
</html>
