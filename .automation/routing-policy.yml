# Politique de routage par sous-agent : routine × bande de complexité (bandes
# de .automation/complexity-thresholds.yml) → modèle candidat, résolu par le
# futur skill coordinateur (#430) via le routeur pur scripts/model-router.mjs
# (#404, hors scope ici). Issue #400, option C tranchée en #423 —
# doc/technical/automation-plan.md § « Routage par sous-agent ».
#
# Chaque bande porte des `candidates` pondérés (poids en somme à 100, jamais
# négatifs) et un `min_score` : un candidat dont le `quality_score` du
# catalogue (.automation/model-catalog.yml) est sous ce plancher est refusé à
# la validation, tout comme un candidat désactivé, absent du catalogue, ou ne
# couvrant pas une capacité requise par la routine (`required_capabilities`).
# `fallback` est le modèle de secours si tous les candidats d'une bande sont
# désactivés. `risk_overrides`, optionnel, force un modèle quel que soit la
# bande de complexité quand le niveau de risque (change-risk, #387, support
# uniquement pour l'instant) atteint le niveau donné — le modèle retenu doit
# couvrir ce niveau via son `max_risk`.
#
# Même sous-ensemble minimal de YAML que .automation/routines.yml (mappings
# imbriqués de scalaires, pas de listes). Validé en CI par le job
# `automation-config` de ci.yml. Schéma documenté :
# schemas/automation/routing-policy.schema.json.
#
# La section `activation` (issue #476, tranche 1/6 de #407) remplace
# l'ancien drapeau global `dry_run` (#406) par une matrice déclarative fine :
# pour un triplet (routine × bande de complexité × niveau de risque), le
# skill du coordinateur calcule et journalise la décision de routage
# ci-dessus, puis résout ici si elle doit rester observée (`observe`, le
# skill continue de lancer ses `Agent` sans override `model`) ou appliquée
# (`apply`). Les clés `activation.<routine>` réutilisent le même espace de
# noms que `routines:` ci-dessous, jamais ceux de .automation/routines.yml.
# Résolue par la fonction pure scripts/routing-activation.mjs#resolveActivation,
# consommée par scripts/routing-dry-run.mjs#resolveRoutingDryRun (#406) à la
# place de l'ancien `dry_run`. Deux garde-fous non contournables par cette
# déclaration : un triplet non couvert résout toujours `observe`, et un
# risque `high` résout toujours `observe` quelle que soit la déclaration
# (l'activation sur risque élevé a sa propre tranche, avec ses propres
# garde-fous). La matrice ci-dessous déclare `observe` partout : cette
# tranche ne change le modèle d'aucune routine, elle ne fait que remplacer
# le mécanisme — le passage réel de tel triplet à `apply` reste un geste de
# configuration séparé et ultérieur (doc/technical/automation-plan.md §5
# « Passage du dry-run à l'activation contrôlée »).
#
# `rollback` (issue #480, tranche 5/6 de #407), optionnel, booléen, absent
# valant `false` : à `true`, force tous les triplets de la matrice
# `activation` ci-dessous en `observe`, sans qu'aucune ligne de la matrice
# n'ait à être modifiée — le geste de rollback complet du routage vers le
# mono-modèle. Priorité la plus haute dans
# scripts/routing-activation.mjs#resolveActivation : aucune déclaration
# `apply` de la matrice, ni même le garde-fou risque `high` ci-dessus, ne
# peut le contredire, et la `reason` renvoyée cite toujours le rollback.
# Effectif au run suivant (lu à chaque invocation, jamais réévalué pour un
# run déjà en vol). Voir doc/automation/model-routing.md § « Rollback » pour
# la procédure complète.
#
# `budgets` (issue #478, tranche 3/6 de #407), optionnel, plafonne la
# consommation d'un run : combien de sous-agents un run peut lancer et
# combien d'itérations de correctif il peut tenter (`per_run`), et combien
# de runs de cette routine peuvent démarrer sur une période glissante
# (`per_period`, aujourd'hui `runs_per_day`). Résolu par
# scripts/routing-budget.mjs#checkBudget, appelé par le skill du
# coordinateur avant chaque lancement de sous-agent — un dépassement arrête
# le run proprement (aucun sous-agent de plus, `automation:needs-human`
# posé) et n'est **jamais** contourné par un modèle moins coûteux, y
# compris sur un risque `high`. Les clés de premier niveau (`coordinator`
# ci-dessous) sont des noms de routine de **dispatch**
# (.automation/routines.yml), un espace de noms distinct de `routines`/
# `activation` ci-dessous (les politiques de routage par sous-agent) — la
# coïncidence de nom avec `pr-review`/`address-feedback` n'implique aucun
# lien entre les deux sections. Un plafond absent est non contraignant ;
# un plafond nul, négatif ou non numérique est refusé au chargement,
# nommant le fichier et la clé (scripts/routing-budget.mjs#loadBudgets).
# Voir doc/automation/model-routing.md § « Budgets » pour le détail.
#
# `budgets.coordinator.per_run.arbitrations` (issue #497, tranche 1/5 de
# l'épic #496) : un seul arbitrage par run, toujours — évalué par ce même
# `checkBudget`, aucun mécanisme nouveau (#496 § « Les cinq garde-fous »
# #1). Un tour arbitré qui ne converge pas mène à `automation:needs-human`,
# jamais à un second arbitrage.
#
# `arbitration` (issue #497), optionnel, déclare un mode (`observe` |
# `apply`) par motif d'escalade arbitrable — jamais un triplet routine ×
# bande comme `activation` ci-dessous, l'arbitrage n'est jamais routé par la
# bande de complexité qui vient d'échouer (ce serait circulaire). Résolue
# par la fonction pure scripts/arbitration.mjs#resolveArbitration, avec les
# mêmes garde-fous non contournables que `resolveActivation` : un motif non
# couvert (ou la section entièrement absente) résout toujours `observe`, un
# risque `high` résout toujours `observe` quelle que soit la déclaration, et
# `rollback: true` ci-dessus force aussi tout l'arbitrage en `observe` —
# aucun nouvel interrupteur, le même geste de rollback global coupe les deux
# mécanismes. La matrice ci-dessous déclare `observe` pour les sept motifs
# arbitrables : cette tranche installe le mécanisme sans en changer le
# comportement, le passage réel d'un motif à `apply` est un geste de
# configuration séparé et ultérieur (T2..T4 de l'épic #496). Voir
# doc/automation/model-routing.md § « Arbitrage » pour le détail.
version: 1
rollback: false
budgets:
  coordinator:
    per_run:
      subagents_launched: 12
      fix_iterations: 3
      arbitrations: 1
    per_period:
      runs_per_day: 20
arbitration:
  spec-ambigue: observe
  finding-trop-vague: observe
  derive-vs-spec: observe
  tentatives-epuisees: observe
  derive-vs-review: observe
  validation-rouge: observe
  findings-contradictoires: observe
activation:
  implement-task:
    trivial: observe
    standard: observe
    complex: observe
    very-complex: observe
  pr-review:
    trivial: observe
    standard: observe
    complex: observe
    very-complex: observe
  classification:
    trivial: observe
    standard: observe
    complex: observe
    very-complex: observe
  address-feedback:
    trivial: observe
    standard: observe
    complex: observe
    very-complex: observe
  arbitration:
    trivial: observe
    standard: observe
    complex: observe
    very-complex: observe
routines:
  implement-task:
    required_capabilities:
      tools: true
      structured_output: false
      long_context: true
    bands:
      trivial:
        candidates:
          primary:
            model: haiku-4-5
            weight: 70
          secondary:
            model: sonnet-5
            weight: 30
        min_score: 40
        fallback: opus-5
      standard:
        candidates:
          primary:
            model: sonnet-5
            weight: 100
        min_score: 60
        fallback: opus-5
      complex:
        candidates:
          primary:
            model: sonnet-5
            weight: 60
          secondary:
            model: opus-5
            weight: 40
        min_score: 75
        fallback: opus-5
      very-complex:
        candidates:
          primary:
            model: opus-5
            weight: 100
        min_score: 90
        fallback: opus-5
    risk_overrides:
      high:
        model: opus-5
  pr-review:
    required_capabilities:
      tools: true
      structured_output: true
      long_context: true
    bands:
      trivial:
        candidates:
          primary:
            model: haiku-4-5
            weight: 70
          secondary:
            model: sonnet-5
            weight: 30
        min_score: 40
        fallback: opus-5
      standard:
        candidates:
          primary:
            model: sonnet-5
            weight: 100
        min_score: 60
        fallback: opus-5
      complex:
        candidates:
          primary:
            model: sonnet-5
            weight: 60
          secondary:
            model: opus-5
            weight: 40
        min_score: 75
        fallback: opus-5
      very-complex:
        candidates:
          primary:
            model: opus-5
            weight: 100
        min_score: 90
        fallback: opus-5
    risk_overrides:
      high:
        model: opus-5
  # Politique du sous-agent classifieur de complexité (#403,
  # .claude/agents/complexity-classifier.md), pas d'une routine de
  # .automation/routines.yml : ce fichier accepte des entrées non référencées
  # par une routine dispatchée (scripts/automation-dispatch.mjs#validateRoutingPolicyCoverage
  # ne vérifie qu'une seule direction — chaque routine référence une entrée
  # existante, jamais l'inverse). Les quatre bandes portent volontairement le
  # même candidat unique à poids 100 : la classification n'est jamais routée
  # par bande de complexité (ce serait circulaire — le classifieur existe pour
  # déterminer cette bande), donc jamais relancée sur un modèle plus coûteux
  # quel que soit son résultat (issue #403, critère d'acceptation).
  classification:
    required_capabilities:
      tools: false
      structured_output: true
      long_context: false
    bands:
      trivial:
        candidates:
          primary:
            model: haiku-4-5
            weight: 100
        min_score: 40
        fallback: sonnet-5
      standard:
        candidates:
          primary:
            model: haiku-4-5
            weight: 100
        min_score: 40
        fallback: sonnet-5
      complex:
        candidates:
          primary:
            model: haiku-4-5
            weight: 100
        min_score: 40
        fallback: sonnet-5
      very-complex:
        candidates:
          primary:
            model: haiku-4-5
            weight: 100
        min_score: 40
        fallback: sonnet-5
  # Politique du sous-agent arbitre (#497, tranche 1/5 de l'épic #496,
  # .claude/agents/arbiter-*.md — T2), pas davantage une routine de
  # .automation/routines.yml que `classification` ci-dessus. Même patron :
  # les quatre bandes portent le même candidat unique à poids 100, jamais
  # routé par bande de complexité — un arbitrage tranche un jugement borné
  # sur un contexte déjà gelé, pas une tâche que la complexité de l'issue
  # ferait varier. `min_score` au plancher du haut du catalogue
  # (.automation/model-catalog.yml : seul `opus-5`, quality_score=95, le
  # franchit — `sonnet-5` à 80 ne l'atteint pas) : un arbitre tranche un
  # désaccord qu'un relecteur ou une boucle de correctif n'a pas su
  # résoudre seul, la qualité prime sur le coût. `structured_output: true`
  # (le verdict suit schemas/automation/arbitration-verdict.schema.json) ;
  # `long_context: true` (le corpus d'un arbitre est une union — spec +
  # diff + findings des deux relecteurs, voire le rapport du correcteur
  # côté `arbiter-expert`, #496 § « Les deux agents »). `fallback: opus-5` —
  # volontairement identique au seul candidat de bande, pas `sonnet-5` comme
  # pour les autres routines : `sonnet-5` (quality_score=80) n'atteint pas
  # `min_score: 90` ci-dessus, et scripts/model-router.mjs#evaluateCandidate
  # applique ce même plancher au fallback de bande qu'aux candidats primaires
  # (« un fallback conserve les mêmes contraintes de sécurité que le choix
  # initial », issue #404) — un `sonnet-5` déclaré ici ne serait donc jamais
  # retenu, contredisant en silence l'idée d'un filet de secours. Si `opus-5`
  # est désactivé au catalogue, `routeModel` renvoie `status: "no-candidate"`
  # (aucun autre modèle du catalogue n'atteint ce `min_score`) : c'est le
  # motif non arbitrable `routage-no-candidate` (condition 5 du coordinateur,
  # doc/automation/model-routing.md § « Arbitrage »), qui escalade toujours
  # directement à un humain plutôt que de dégrader silencieusement la
  # qualité d'un jugement — cohérent avec « la qualité prime sur le coût »
  # ci-dessus, jamais un bug.
  arbitration:
    required_capabilities:
      tools: false
      structured_output: true
      long_context: true
    bands:
      trivial:
        candidates:
          primary:
            model: opus-5
            weight: 100
        min_score: 90
        fallback: opus-5
      standard:
        candidates:
          primary:
            model: opus-5
            weight: 100
        min_score: 90
        fallback: opus-5
      complex:
        candidates:
          primary:
            model: opus-5
            weight: 100
        min_score: 90
        fallback: opus-5
      very-complex:
        candidates:
          primary:
            model: opus-5
            weight: 100
        min_score: 90
        fallback: opus-5
  address-feedback:
    required_capabilities:
      tools: true
      structured_output: false
      long_context: true
    bands:
      trivial:
        candidates:
          primary:
            model: haiku-4-5
            weight: 70
          secondary:
            model: sonnet-5
            weight: 30
        min_score: 40
        fallback: opus-5
      standard:
        candidates:
          primary:
            model: sonnet-5
            weight: 100
        min_score: 60
        fallback: opus-5
      complex:
        candidates:
          primary:
            model: sonnet-5
            weight: 60
          secondary:
            model: opus-5
            weight: 40
        min_score: 75
        fallback: opus-5
      very-complex:
        candidates:
          primary:
            model: opus-5
            weight: 100
        min_score: 90
        fallback: opus-5
    risk_overrides:
      high:
        model: opus-5
